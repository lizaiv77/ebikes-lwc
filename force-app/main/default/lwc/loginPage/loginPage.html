<template>
    <lightning-card title="Login" icon-name="standard:user">
        <div class="slds-var-p-around_medium">
            <lightning-input
                type="text"
                label="Username"
                value={username}
                onchange={handleUsernameChange}
                required
            ></lightning-input>
            <lightning-input
                type="password"
                label="Password"
                value={password}
                onchange={handlePasswordChange}
                required
            ></lightning-input>
            <div class="slds-var-m-top_medium slds-text-align_center">
                <lightning-button
                    variant="brand"
                    label="Submit"
                    onclick={handleSubmit}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
